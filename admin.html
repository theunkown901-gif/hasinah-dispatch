<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حسينة | إدارة طلبات الإرجاع</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-page">
      <section id="loginView" class="login-view">
        <div class="brand">
          <span class="brand-mark">ح</span>
          <span>حسينة</span>
        </div>
        <h1>إدارة طلبات الإرجاع والاستبدال</h1>
        <label>
          كلمة مرور الإدارة
          <input id="adminPassword" type="password" autocomplete="current-password" placeholder="اكتبي كلمة المرور" />
        </label>
        <button id="adminLoginBtn" type="button">دخول</button>
        <p id="loginError" role="alert"></p>
      </section>

      <section id="ordersView" class="orders-view" hidden>
        <header class="admin-topbar">
          <div>
            <p>لوحة الإدارة</p>
            <h1>طلبات العملاء</h1>
          </div>
          <div class="topbar-actions">
            <a href="return.html">صفحة العميل</a>
            <button id="logoutBtn" type="button">خروج</button>
          </div>
        </header>

        <div class="filters">
          <button class="filter active" data-filter="all" type="button">الكل</button>
          <button class="filter" data-filter="جديد" type="button">جديد</button>
          <button class="filter" data-filter="مقبول" type="button">مقبول</button>
          <button class="filter" data-filter="مرفوض" type="button">مرفوض</button>
          <button class="filter" data-filter="بانتظار التواصل" type="button">بانتظار التواصل</button>
        </div>

        <div id="ordersList" class="orders-list"></div>
      </section>
    </main>

    <div id="denyModal" class="modal" hidden>
      <div class="modal-card">
        <h2>سبب الرفض</h2>
        <p>اكتبي سببًا واضحًا قبل رفض الطلب.</p>
        <textarea id="denyReason" rows="4" placeholder="مثال: الصور غير واضحة أو الطلب خارج السياسة"></textarea>
        <div class="modal-actions">
          <button id="cancelDenyBtn" type="button">إلغاء</button>
          <button id="confirmDenyBtn" type="button">تأكيد الرفض</button>
        </div>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
