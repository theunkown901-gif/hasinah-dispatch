<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <title>حسينة | بوابة التشغيل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="loginView" class="login-view">
      <form id="loginForm" class="login-card">
        <div class="brand-mark">H</div>
        <h1>حسينة</h1>
        <p>بوابة التشغيل الداخلية</p>
        <input id="username" autocomplete="username" placeholder="اسم المستخدم" required />
        <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required />
        <button class="primary-btn" type="submit">دخول</button>
        <p id="loginError" class="error"></p>
      </form>
    </section>

    <section id="appView" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-mark">H</div>
          <div>
            <strong>حسينة</strong>
            <span id="sessionName">بوابة التشغيل</span>
          </div>
        </div>

        <nav class="nav-tabs">
          <button class="nav-tab active" data-view="home" type="button">الرئيسية</button>
          <button class="nav-tab" data-view="dispatch" type="button">التوصيل</button>
          <a class="nav-tab nav-link" href="https://theunkown901-gif.github.io/garmentyahya/" target="_blank" rel="noreferrer">الملابس</a>
        </nav>

        <button id="logoutBtn" class="ghost-btn" type="button">تسجيل الخروج</button>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <p class="eyebrow">حسينة جدة</p>
            <h2 id="viewTitle">الرئيسية</h2>
          </div>
        </header>

        <section id="homeView" class="view active-view">
          <div class="portal-grid">
            <button class="portal-card delivery-card" data-view-jump="dispatch" type="button">
              <span class="portal-icon">
                <svg viewBox="0 0 24 24"><path d="M3.5 7.5h10.2v8.8H3.5z"/><path d="M13.7 10.2h3.1l2.2 2.6v3.5h-5.3z"/><path d="M7.2 18.4a1.7 1.7 0 1 0 0-3.4 1.7 1.7 0 0 0 0 3.4ZM16.7 18.4a1.7 1.7 0 1 0 0-3.4 1.7 1.7 0 0 0 0 3.4Z"/></svg>
              </span>
              <strong>تطبيق التوصيل والسائقين</strong>
              <small>مدمج داخل هذه البوابة لإضافة الطلبات، تعيين السائقين، ومتابعة حالات التوصيل.</small>
            </button>

            <a class="portal-card garments-card" href="https://theunkown901-gif.github.io/garmentyahya/" target="_blank" rel="noreferrer">
              <span class="portal-icon">
                <svg viewBox="0 0 24 24"><path d="M9 4.2 12 6l3-1.8 3.4 2.2-2 4.2-1.8-.8v9.9H9.4V9.8l-1.8.8-2-4.2z"/><path d="M9.4 9.8c1.8 1.1 3.4 1.1 5.2 0"/></svg>
              </span>
              <strong>تطبيق تتبع الملابس</strong>
              <small>رابط مباشر للتطبيق المنشور لإدارة قطع الملابس والعملاء والمخزون.</small>
            </a>
          </div>
        </section>

        <section id="dispatchView" class="view">
          <div class="dispatch-layout">
            <form id="orderForm" class="panel form-panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">طلب جديد</p>
                  <h3>إضافة طلب توصيل</h3>
                </div>
              </div>

              <label>
                رقم الطلب
                <input name="number" placeholder="123456" required />
              </label>
              <label>
                اسم العميل
                <input name="customer" placeholder="اسم العميل" required />
              </label>
              <div class="two-col">
                <label>
                  واتساب
                  <input name="phone" inputmode="tel" placeholder="0512345122" required />
                </label>
                <label>
                  الحي
                  <input name="area" placeholder="الروضة" required />
                </label>
              </div>
              <div class="two-col">
                <label>
                  نوع العملية
                  <select name="type">
                    <option value="delivery">توصيل</option>
                    <option value="return">إرجاع</option>
                    <option value="replacement">استبدال</option>
                  </select>
                </label>
                <label>
                  السائق
                  <select id="driverSelect" name="driverId"></select>
                </label>
              </div>
              <button class="primary-btn" type="submit">إضافة الطلب</button>
            </form>

            <section class="panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">الفريق</p>
                  <h3>إضافة سائق</h3>
                </div>
              </div>
              <form id="driverForm" class="mini-form">
                <input id="driverName" placeholder="اسم السائق" required />
                <input id="driverUsername" placeholder="اسم المستخدم" required />
                <input id="driverPassword" placeholder="كلمة المرور" required />
                <button class="ghost-btn" type="submit">إضافة سائق</button>
              </form>
              <div id="driversList" class="list"></div>
            </section>

            <section class="panel board-panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">لوحة الطلبات</p>
                  <h3>متابعة الطلبات</h3>
                </div>
                <select id="statusFilter">
                  <option value="all">كل الطلبات</option>
                  <option value="new">جديد</option>
                  <option value="assigned">مسند</option>
                  <option value="done">منجز</option>
                </select>
              </div>
              <div id="ordersList" class="orders-list"></div>
            </section>
          </div>
        </section>
      </main>
    </section>

    <script src="app.js"></script>
  </body>
</html>
